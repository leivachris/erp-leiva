<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    ERP LEIVA - Logo principal
    ========================
    Caja isometrica (vista 3D de un almacen) con indicador "online" verde
    en la esquina superior derecha. Margen de ~40px respecto al borde.
  -->
  <defs>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="rightG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="leftG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="chkG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Sombra suave bajo la caja -->
  <ellipse cx="256" cy="430" rx="170" ry="14" fill="#000" opacity="0.12"/>

  <!--
    Caja isometrica: vertices definidos de forma explicita
      A = esquina superior del rombo (top)
      B = esquina derecha del rombo
      C = esquina inferior del rombo (mid)
      D = esquina izquierda del rombo
      E = esquina inferior derecha (extruida vertical)
      F = esquina inferior del cubo
      G = esquina inferior izquierda (extruida vertical)
    Cubo centrado horizontal; ocupa x=[80,432], y=[120,420]
  -->
  <!-- Cara superior (rombo) -->
  <polygon points="256,120 432,220 256,320 80,220"
           fill="url(#topG)" stroke="#1e40af" stroke-width="6" stroke-linejoin="round"/>

  <!-- Cara derecha (paralelogramo colgando de la derecha) -->
  <polygon points="432,220 432,380 256,480 256,320"
           fill="url(#rightG)" stroke="#1e40af" stroke-width="6" stroke-linejoin="round"/>

  <!-- Cara izquierda (paralelogramo colgando de la izquierda) -->
  <polygon points="80,220 80,380 256,480 256,320"
           fill="url(#leftG)" stroke="#1e40af" stroke-width="6" stroke-linejoin="round"/>

  <!-- Cinta horizontal azul oscuro (atadura tipica de cajas) -->
  <polygon points="256,320 432,220 432,250 256,350 80,250 80,220"
           fill="#1e3a8a" opacity="0.95"/>

  <!-- Indicador "online" verde (esquina superior derecha) -->
  <!-- Posicion: chk_cx=400, chk_cy=110, r=58 -> x:[42,432], y:[52,168] (dentro del canvas 0..512 con margen) -->
  <circle cx="400" cy="110" r="58" fill="url(#chkG)" stroke="#ffffff" stroke-width="10"/>
  <!-- Check -->
  <path d="M 372,113 L 392,134 L 432,90"
        fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>